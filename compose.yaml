services:
  netlab:
    build: .
    restart: unless-stopped
    expose:
      - "8787"
    read_only: true
    security_opt:
      - no-new-privileges:true
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      NETLAB_DOMAIN: ${NETLAB_DOMAIN:?Defina NETLAB_DOMAIN no arquivo .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - netlab
volumes:
  caddy_data:
  caddy_config:
