[package]
name = "netlab-server"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Interface gráfica e rede de comunicação real do NetLab"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
if-addrs = "0.13"
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
netlab-network = { path = "../netlab-network" }
netlab-protocols = { path = "../netlab-protocols" }

[dev-dependencies]
tokio-tungstenite = "0.29"
futures-util = { version = "0.3", features = ["sink"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Devices_Bluetooth", "Win32_Networking_WinSock", "Win32_Foundation", "Win32_Security_Cryptography"] }
